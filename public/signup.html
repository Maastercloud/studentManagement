<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Your Account</title>
<style>
  :root {
    --blue-700: #1d4ed8;
    --blue-800: #1e40af;
    --blue-50: #eff6ff;
    --blue-100: #dbeafe;
    --ink: #1f2a44;
    --muted: #64748b;
    --error: #dc2626;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blue-700);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }

  .card-header {
    background: var(--blue-700);
    padding: 28px 24px;
    text-align: center;
  }

  .card-header h1 {
    color: var(--white);
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .card-body {
    padding: 28px 28px 24px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--blue-50);
    border: 1px solid var(--blue-100);
    border-radius: 8px;
    padding: 11px 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-wrap:focus-within {
    border-color: var(--blue-700);
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
  }

  .input-wrap svg {
    flex-shrink: 0;
    color: var(--blue-700);
  }

  .input-wrap input {
    border: none;
    background: transparent;
    outline: none;
    width: 100%;
    font-size: 15px;
    color: var(--ink);
  }

  .input-wrap input::placeholder {
    color: #94a3b8;
  }

  .field-error {
    color: var(--error);
    font-size: 13px;
    margin-top: 6px;
    min-height: 16px;
  }

  .hint {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }

  .submit-btn {
    width: 100%;
    background: var(--blue-700);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    transition: background 0.15s ease;
  }

  .submit-btn:hover { background: var(--blue-800); }
  .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  .switch-row {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink);
  }

  .switch-row a {
    color: var(--blue-700);
    font-weight: 600;
    text-decoration: none;
  }

  .switch-row a:hover { text-decoration: underline; }

  .form-status {
    text-align: center;
    font-size: 14px;
    margin-top: 14px;
    min-height: 18px;
  }

  .form-status.error { color: var(--error); }
  .form-status.success { color: #16a34a; }
</style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Create Your Account</h1>
    </div>

    <div class="card-body">
      <form id="signupForm" novalidate>

        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" stroke="none"/><path d="M22 6l-10 7L2 6"/><path d="M2 6h20v12H2z"/></svg>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required />
          </div>
          <div class="hint">At least 8 characters</div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required />
          </div>
          <div class="field-error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Sign Up
        </button>

        <div class="form-status" id="formStatus"></div>
      </form>

      <div class="switch-row">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

<script>
  const API_URL = "/api/signup"; // point this at your Express route

  const form = document.getElementById("signupForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const confirmInput = document.getElementById("confirmPassword");
  const submitBtn = document.getElementById("submitBtn");
  const formStatus = document.getElementById("formStatus");

  function setError(id, message) {
    document.getElementById(id).textContent = message || "";
  }

  function validate() {
    let valid = true;
    setError("emailError", "");
    setError("passwordError", "");
    setError("confirmPasswordError", "");

    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRe.test(emailInput.value.trim())) {
      setError("emailError", "Enter a valid email address");
      valid = false;
    }

    if (passwordInput.value.length < 8) {
      setError("passwordError", "Password must be at least 8 characters");
      valid = false;
    }

    if (confirmInput.value !== passwordInput.value) {
      setError("confirmPasswordError", "Passwords don't match");
      valid = false;
    }

    return valid;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formStatus.textContent = "";
    formStatus.className = "form-status";

    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          password: passwordInput.value
        })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        formStatus.textContent = data.message || "Something went wrong. Please try again.";
        formStatus.classList.add("error");
        return;
      }

      formStatus.textContent = "Account created! You can now log in.";
      formStatus.classList.add("success");
      form.reset();

    } catch (err) {
      formStatus.textContent = "Couldn't reach the server. Check your connection.";
      formStatus.classList.add("error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign Up";
    }
  });
</script>

</body>
</html>
